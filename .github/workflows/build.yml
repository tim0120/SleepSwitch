name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test sleep status parsing
        run: ./Scripts/test.sh
      - name: Check script syntax
        run: |
          for script in Scripts/*.sh; do
            case "$script" in
              *passwordless*) zsh -n "$script" ;;
              *) bash -n "$script" ;;
            esac
          done
          zsh -n Scripts/sleep-switch
      - name: Build universal release packages
        run: ./Scripts/package-release.sh
      - name: Verify app and read status
        run: |
          lipo build/SleepSwitch.app/Contents/MacOS/SleepSwitch -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 build/SleepSwitch.app
          if status_output="$(build/SleepSwitch.app/Contents/MacOS/SleepSwitch --status 2>&1)"; then
            printf '%s\n' "$status_output"
          else
            status_code=$?
            printf '%s\n' "$status_output"
            # A VM may expose no live power settings. Unknown is a valid, tested
            # result; crashes or other failures must still fail the build.
            test "$status_code" -eq 1
            [[ "$status_output" == *"Sleep status unknown"* ]]
          fi
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SleepSwitch-universal
          path: dist/
          if-no-files-found: error
